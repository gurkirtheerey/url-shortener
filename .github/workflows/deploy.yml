name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: render-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render API deploy
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK_URL"

      - name: Trigger Render dashboard deploy
        env:
          RENDER_DASHBOARD_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DASHBOARD_DEPLOY_HOOK_URL"
